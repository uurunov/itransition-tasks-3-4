<header class="absolute inset-x-0 top-8 flex flex-col justify-center items-center gap-2">
  <p-avatar image="images/author.png" class="mr-2" size="xlarge" shape="circle" />
  <p-chip label="Ulugbek Urunov" />
</header>

<main class="w-xs 2xl:w-sm">
  <h2 class="text-2xl mb-6 text-center">Sign in to the app</h2>

  <form (ngSubmit)="onSubmit()" pFocusTrap class="flex flex-col gap-4">
    <p-iconfield>
      <p-inputicon class="pi pi-envelope" />
      <input
        pInputText
        placeholder="Email"
        id="email"
        type="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        name="email"
        class="w-full"
        required
      />
    </p-iconfield>

    <p-iconfield>
      <p-inputicon class="pi pi-lock" />
      <p-password
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        [feedback]="false"
        autocomplete="off"
        [toggleMask]="true"
        placeholder="Password"
        name="password"
        fluid
        required
      />
    </p-iconfield>

    @if (errorMessage()) {
      <p-message severity="error" size="small" variant="simple">{{ errorMessage() }}</p-message>
    }

    <p-button
      type="submit"
      label="Sign In"
      [loading]="isLoading()"
      styleClass="w-full"
      [disabled]="isLoading()"
    />
  </form>

  <div class="flex items-center justify-center">
    <h6 class="text-sm">Don't have an account?</h6>
    <p-button label="Sign up" size="small" (click)="onSignUp()" link />
  </div>
</main>

<footer class="absolute inset-x-0 bottom-8 flex justify-center items-center gap-2">
  <p-chip class="text-sm" label="uurunov.dev@gmail.com" icon="pi pi-google" />
</footer>
